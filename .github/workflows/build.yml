name: Build Samalot APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q samalut-apk-build.zip -d extracted
          cp -a extracted/samalut-apk-build/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_DIR" > local.properties
          [ -f .env.example ] && cp .env.example .env || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samalot-APK
          path: app/build/outputs/apk/debug/*.apk
          
