name: Build Samalot APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q samalut-apk-build.zip -d extracted
          cp -a extracted/samalut-apk-build/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Xmx3g"
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_DIR" > local.properties
          [ -f .env.example ] && cp .env.example .env || true

          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp -f debug.keystore app/debug.keystore 2>/dev/null || true

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-configuration-cache -x lint -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samalot-APK
          path: app/build/outputs/apk/debug/*.apk
          
